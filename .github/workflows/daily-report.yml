name: Daily Report

# Sin `schedule:` a proposito. El cron de GitHub Actions arranca cuando quiere:
# medido en este repo, entre +1 h 56 y +3 h 34 sobre la hora pedida, con 1 h 38
# de deriva y sin patron. Para una hora fija no sirve.
# El disparo lo hace un cronjob externo (cron-job.org) contra la API de
# dispatches, configurado en Europe/Madrid. Ver SETUP.md.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Recorrer todo el camino real pero escribir el reporte en el log en vez de en Slack'
        type: boolean
        default: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Run daily report
        env:
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

          # Valores MEDIDOS contra las APIs el 2026-07-29/30. No copiar de otro repo.
          META_ACCOUNT_TIMEZONE: 'Europe/Madrid'   # act_2217973965310655 -> timezone_name
          META_CURRENCY: 'USD'                     # act_2217973965310655 -> currency
          STORE_CURRENCY: 'EUR'                    # shop.json -> currency
          STORE_LOCALE: 'es-ES'
          MIN_HOURS_AFTER_CLOSE: '3'
          REPORT_TIME_LABEL: '09:00 Europe/Madrid'
          REPORT_TIMEZONE: 'Europe/Madrid'
          SUBSCRIPTION_TIMEZONE: 'Europe/Madrid'  # dia natural de los cobros

          DRY_RUN: ${{ inputs.dry_run }}
        run: node src/report.js
